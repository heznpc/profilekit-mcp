name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Required for npm OIDC trusted publishing
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - run: npm run smoke:mcp
      - run: node dist/bin.js help
      - run: npm pack --dry-run --json
      # OIDC trusted publishing requires the @heznpc/profilekit-mcp package
      # on npmjs.com to have a trusted publisher linked to
      # github.com/starter-series/profilekit-mcp + this workflow file. With that
      # linked, npm publish auto-injects provenance attestations and
      # short-lived credentials — no NPM_TOKEN needed. If the trusted
      # publisher is not yet configured, this step fails with a clear
      # message; do not fall back to a long-lived token.
      - run: npm publish --access public
