name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit
        run: npm audit --audit-level=high

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke MCP server
        run: npm run smoke:mcp

      - name: Check CLI help
        run: node dist/bin.js help

      - name: Verify package contents
        run: npm run pack:check

      # OIDC trusted publishing requires the profilekit-mcp package on npmjs.com
      # to have a trusted publisher linked to this repository and workflow file.
      # With that linked, npm publish auto-injects provenance attestations and
      # short-lived credentials; do not fall back to a long-lived token.
      - name: Publish
        run: npm publish
